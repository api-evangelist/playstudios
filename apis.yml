aid: playstudios
name: PLAYSTUDIOS
description: 'PLAYSTUDIOS, Inc. (Nasdaq: MYPS) is a developer and publisher of free-to-play
  casual and casino-style mobile and social games, including myVEGAS Slots, POP! Slots,
  MGM Slots Live, myKONAMI, Tetris Block Puzzle, Solitaire, Bingo, and Mahjong titles.
  Its differentiating platform, playAWARDS, is a loyalty rewards engine that lets players
  earn real-world rewards from brand partners across gaming, hospitality, dining, and
  entertainment. The company is headquartered in Las Vegas and went public in 2021 via
  a business combination with Acies Acquisition Corp. This API Evangelist profile was
  surfaced as a dcm-ventures portfolio company; PLAYSTUDIOS publishes consumer-facing
  games and corporate/investor properties but no public developer API surface was found
  during enrichment.'
